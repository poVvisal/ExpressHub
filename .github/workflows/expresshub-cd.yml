name: ExpressHub CD

on:
  workflow_run:
    workflows: ["ExpressHub CI"]
    types:
      - completed
    branches:
      - main

env:
  TF_DIR: "terraform/dev"
  CONTAINER_NAME: "foodexpress-js"
  APP_PORT: "5000"
  HEALTHCHECK_PATH: "/"
  DOCKER_IMAGE_NAME: "expresshub-app"

jobs:
  deploy-infra:
    name: Terraform Apply
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      ec2_public_ip: ${{ steps.tf_output.outputs.ec2_public_ip }}
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}
    # BOOM: Job-level environment variables! No more repeating yourself.
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: "us-east-1"
      TF_VAR_grafana_password: ${{ secrets.TF_VAR_GRAFANA_PASSWORD }}
      TF_HTTP_USERNAME: ${{ secrets.GH_USERNAME }}
      TF_HTTP_PASSWORD: ${{ secrets.GH_PAT }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Read EC2 Output
        id: tf_output
        run: |
          PUBLIC_IP=$(terraform output -raw public_ip)
          echo "ec2_public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT

  deploy-app:
    name: Deploy App to EC2
    needs: deploy-infra
    runs-on: ubuntu-latest
    steps:
      - name: Set Image Tag
        id: vars
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "IMAGE_REF=${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ needs.deploy-infra.outputs.ec2_public_ip }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_REF,CONTAINER_NAME,APP_PORT,HEALTHCHECK_PATH
          # Ah nis very beautiful. Clean, readable, and functional.
          script: |
            set -euo pipefail
            cd /home/ubuntu/ExpressHub/build-process

            # Log in and pull the fresh image
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            
            # Export env vars so docker-compose can read them
            export IMAGE_REF=$IMAGE_REF
            export APP_PORT=$APP_PORT
            
            docker compose pull foodexpress-js
            
            # Smart restart: This updates ONLY the app container without touching Grafana/Prometheus!
            docker compose up -d foodexpress-js
            
            echo "Waiting for app to spin up..."
            sleep 10
            
            if ! curl -s -f http://localhost:$APP_PORT$HEALTHCHECK_PATH > /dev/null; then
              echo "CRITICAL: Health check failed! Dumping logs:"
              docker compose logs foodexpress-js
              exit 1
            fi
            
            echo "Deployment successful! App is healthy via Compose."
